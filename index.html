<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moon Today</title>
  <meta name="description" content="Today's moon phase, illumination and the next new, quarter and full moons.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d14;
      --bg-2: #141827;
      --ink: #e9e4d6;
      --muted: #8c8a93;
      --line: #262a3a;
      --lit: #f1ead4;
      --dark: #1b1f2e;
      --accent: #d9b56a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
      color: var(--ink);
      font: 15px/1.5 "IBM Plex Mono", ui-monospace, monospace;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 440px; text-align: center; }

    .date {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
    }
    .date button {
      background: none; border: 1px solid var(--line); color: var(--muted);
      width: 32px; height: 32px; border-radius: 50%; font: inherit; cursor: pointer;
    }
    .date button:hover { color: var(--ink); border-color: var(--muted); }
    .date button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #today { font-size: 11px; width: auto; padding: 0 12px; border-radius: 16px; }
    #today[hidden] { display: none; }

    svg.moon { width: min(72vw, 300px); height: auto; margin: 32px auto 8px; display: block; overflow: visible; }
    .moon .dark { fill: var(--dark); }
    .moon .lit { fill: url(#litGrad); }
    .moon .glow { fill: var(--lit); opacity: .08; filter: blur(18px); }

    h1 {
      font: italic 500 clamp(40px, 11vw, 56px)/1.05 "Cormorant Garamond", Georgia, serif;
      margin: 16px 0 4px; letter-spacing: -.01em;
    }
    .sub { color: var(--muted); margin: 0 0 32px; font-size: 13px; min-height: 1.5em; }

    dl.stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      margin: 0 0 32px; padding: 16px 0;
    }
    .stats div + div { border-left: 1px solid var(--line); }
    .stats dt { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .stats dd { margin: 4px 0 0; font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }

    h2 { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 8px; text-align: left; }
    ol.upcoming { list-style: none; margin: 0; padding: 0; text-align: left; }
    .upcoming li {
      display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--line);
    }
    .upcoming svg { width: 22px; height: 22px; }
    .upcoming .when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .upcoming .in { display: block; color: var(--accent); font-size: 12px; }

    footer { margin-top: 32px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="date">
      <button id="prev" aria-label="Previous day">‹</button>
      <span id="date"></span>
      <button id="next" aria-label="Next day">›</button>
    </div>
    <div class="date" style="margin-top:8px"><button id="today" hidden>Back to today</button></div>

    <svg class="moon" viewBox="-110 -110 220 220" role="img" aria-labelledby="phase">
      <defs>
        <radialGradient id="litGrad" cx="35%" cy="35%" r="75%">
          <stop offset="0" stop-color="#fbf6e6"/>
          <stop offset="1" stop-color="#d8cfb4"/>
        </radialGradient>
      </defs>
      <circle class="glow" r="100"/>
      <circle class="dark" r="100"/>
      <path class="lit" id="lit"/>
    </svg>

    <h1 id="phase">…</h1>
    <p class="sub" id="sub"></p>

    <dl class="stats">
      <div><dt>Illuminated</dt><dd id="illum"></dd></div>
      <div><dt>Moon age</dt><dd id="age"></dd></div>
      <div><dt>Trend</dt><dd id="trend"></dd></div>
    </dl>

    <h2>Coming up</h2>
    <ol class="upcoming" id="upcoming"></ol>

    <footer>Computed in your browser · times in your local time zone</footer>
  </main>

  <script type="module">
    import { litPath, moonInfo } from './moon.js';

    const $ = (id) => document.getElementById(id);
    const DAY = 86400000;
    let offset = 0; // days from today

    const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const whenFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const timeFmt = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });

    function relDays(ms) {
      const d = Math.round(ms / DAY);
      if (d === 0) return ms > 0 ? `in ${Math.max(1, Math.round(ms / 3600000))} h` : '';
      return d === 1 ? 'tomorrow' : `in ${d} days`;
    }

    function render() {
      const now = new Date();
      // Today uses the current moment; other days use local noon.
      const at = offset === 0 ? now
        : new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset, 12);
      const info = moonInfo(at);

      $('date').textContent = offset === 0 ? `Today · ${dateFmt.format(at)}` : dateFmt.format(at);
      $('today').hidden = offset === 0;
      $('lit').setAttribute('d', litPath(info.elongation));
      $('phase').textContent = info.phase.name;
      $('sub').textContent = info.phase.at
        ? `Exact at ${timeFmt.format(info.phase.at)}`
        : `${info.upcoming[0].name} ${relDays(info.upcoming[0].at - at)}`;
      $('illum').textContent = `${Math.round(info.illumination * 100)}%`;
      $('age').textContent = `${info.age.toFixed(1)} d`;
      $('trend').textContent = info.waxing ? 'Waxing ↑' : 'Waning ↓';

      $('upcoming').replaceChildren(...info.upcoming.map((p) => {
        const li = document.createElement('li');
        li.innerHTML = `<svg viewBox="-110 -110 220 220" aria-hidden="true">
            <circle r="100" fill="var(--dark)" stroke="var(--line)" stroke-width="8"/>
            <path d="${litPath(p.angle + 0.01)}" fill="var(--lit)"/></svg>
          <span>${p.name}<span class="in"></span></span>
          <span class="when"></span>`;
        li.querySelector('.in').textContent = relDays(p.at - at);
        li.querySelector('.when').textContent = whenFmt.format(p.at);
        return li;
      }));
      document.title = `${info.phase.name} · Moon Today`;
    }

    $('prev').onclick = () => { offset--; render(); };
    $('next').onclick = () => { offset++; render(); };
    $('today').onclick = () => { offset = 0; render(); };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') $('prev').click();
      if (e.key === 'ArrowRight') $('next').click();
      if (e.key === 't') $('today').click();
    });

    render();
    setInterval(() => { if (offset === 0) render(); }, 60000);
  </script>
</body>
</html>
